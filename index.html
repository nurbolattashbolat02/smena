<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Съёмочная смена: 20 рилсов за два дня, порядок съёмки, сценарии и чек-листы.">
<title>Съёмочная смена Жасулана</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F7F6F3; --surface:#FFFFFF; --sunk:#F0EEEA;
  --ink:#15161A; --ink2:#494C53; --muted:#8A8D94;
  --line:#E3E0DA; --line2:#EDEBE6;
  --ok:#1B7F4D; --ok-bg:#E4F1E9;
  --bad:#C0392B; --bad-bg:#F7E4E1;
  --warn:#9A6B12; --warn-bg:#F6EBD5;
  --sh:0 1px 2px rgba(21,22,26,.04), 0 8px 24px rgba(21,22,26,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1013; --surface:#16181C; --sunk:#1E2126;
    --ink:#ECEDEF; --ink2:#B5B9C0; --muted:#7C818A;
    --line:#262A30; --line2:#1D2024;
    --ok:#52B481; --ok-bg:#15291F;
    --bad:#E0776A; --bad-bg:#2D1A17;
    --warn:#D2A44A; --warn-bg:#2A2113;
    --sh:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1013; --surface:#16181C; --sunk:#1E2126;
  --ink:#ECEDEF; --ink2:#B5B9C0; --muted:#7C818A;
  --line:#262A30; --line2:#1D2024;
  --ok:#52B481; --ok-bg:#15291F;
  --bad:#E0776A; --bad-bg:#2D1A17;
  --warn:#D2A44A; --warn-bg:#2A2113;
  --sh:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Golos Text", "Segoe UI", system-ui, sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  letter-spacing:-.004em;
}
.wrap{max-width:900px; margin:0 auto; padding-inline:20px; padding-block:0 96px}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:Unbounded, sans-serif; font-size:10px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
}

/* ================= header ================= */
.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:30; background:var(--paper); border-bottom:1px solid var(--line)}
.top-in{max-width:900px; margin:0 auto; padding-inline:20px; padding-block:18px 0}
.brand{display:flex; align-items:baseline; gap:11px; flex-wrap:wrap}
.brand h1{
  font-family:Unbounded, sans-serif; font-weight:600; font-size:17px;
  letter-spacing:-.02em; margin:0;
}
.brand .sub{color:var(--muted); font-size:13px}

.meter{display:flex; align-items:center; gap:14px; margin-top:15px; flex-wrap:wrap}
.segbar{display:flex; gap:3px; flex:1 1 240px; min-width:160px}
.segbar i{flex:1 1 0; height:5px; border-radius:2px; background:var(--line); transition:background .3s}
.segbar i.on{background:var(--ok)}
.segbar i.re{background:var(--bad)}
.segbar i.mv{background:var(--warn)}
.segbar i.gap{margin-right:7px}
.meter b{font-family:"IBM Plex Mono", monospace; font-weight:500; font-size:13px; font-variant-numeric:tabular-nums}
.meter .m2{color:var(--muted); font-size:13px}
.saved{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ok); opacity:0; transition:opacity .25s}
.saved.on{opacity:1}

.tabs{display:flex; gap:24px; margin-top:16px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  appearance:none; border:none; background:none; cursor:pointer; white-space:nowrap;
  font-family:"Golos Text", sans-serif; font-size:14px; font-weight:500; color:var(--muted);
  padding:0 0 13px; border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--ink); outline-offset:3px; border-radius:2px}

.notice{
  margin-top:18px; padding:11px 14px; border-radius:10px;
  background:var(--warn-bg); color:var(--warn); font-size:13.5px;
}
.lead{max-width:62ch; color:var(--ink2); font-size:14.5px; margin:10px 0 0}
.lead b{color:var(--ink); font-weight:600}

/* ================= filters ================= */
.filters{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:22px 0 0}
.filters button{
  appearance:none; background:transparent; border:1px solid var(--line); color:var(--ink2);
  font-family:"Golos Text",sans-serif; font-size:13px; padding:6px 13px; border-radius:99px; cursor:pointer;
  transition:background .15s, color .15s, border-color .15s;
}
.filters button:hover{border-color:var(--muted); color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:500}
.filters button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.filters .spacer{flex:1}
.filters .act{border-style:dashed; color:var(--ink)}

/* ================= section head ================= */
.block-head{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  margin:36px 0 2px; padding-bottom:9px; border-bottom:1px solid var(--line);
}
.block-head .loc{
  font-family:Unbounded, sans-serif; font-size:11px; font-weight:500;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink);
}
.block-head .meta{color:var(--muted); font-size:11.5px; font-family:"IBM Plex Mono", monospace}

.break{
  display:flex; gap:12px; align-items:baseline; padding:11px 0 11px 14px; margin:2px 0;
  color:var(--muted); font-size:13.5px;
}
.break time{font-family:"IBM Plex Mono", monospace; font-size:12px; flex:none}

/* ================= shot rows ================= */
.item{border-bottom:1px solid var(--line2); background:transparent; transition:background .18s}
.item[open]{background:var(--surface); border-radius:14px; box-shadow:var(--sh); border-bottom-color:transparent; margin:8px 0}
.item[open] > summary{background:transparent}
.item[open] + .item{border-top:1px solid var(--line2)}
.item:last-of-type{border-bottom:none}
.item > summary{
  list-style:none; cursor:pointer; display:flex; align-items:center; gap:13px;
  padding:14px 12px; border-radius:10px; transition:background .15s;
}
.item > summary::-webkit-details-marker{display:none}
.item > summary:hover{background:var(--surface)}
.item > summary:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}
.dot{
  width:9px; height:9px; border-radius:50%; flex:none;
  background:transparent; border:1.5px solid var(--line); transition:all .2s;
}
.item[data-st="shot"] .dot{background:var(--ok); border-color:var(--ok)}
.item[data-st="retake"] .dot{background:var(--bad); border-color:var(--bad)}
.item[data-st="moved"] .dot{background:var(--warn); border-color:var(--warn)}
.tm{font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; flex:none}
.num{font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--muted); flex:none; min-width:18px}
.item > summary h3{
  flex:1 1 auto; min-width:0; margin:0; font-size:15.5px; font-weight:500; line-height:1.35;
  letter-spacing:-.011em; transition:color .2s;
}
.item[data-st="shot"] > summary h3{color:var(--muted)}
.chip{
  font-family:Unbounded, sans-serif; font-size:9px; font-weight:500; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap; flex:none;
}
.chip.f-otlichie{color:var(--ink2)}
.chip.f-zayavka{color:var(--warn)}
.flag{
  font-size:11px; padding:3px 8px; border-radius:99px; flex:none; white-space:nowrap;
  background:var(--warn-bg); color:var(--warn); font-weight:500;
}
.chev{color:var(--line); font-size:10px; flex:none; transition:transform .2s, color .2s}
.item > summary:hover .chev{color:var(--muted)}
.item[open] .chev{transform:rotate(90deg); color:var(--muted)}
.item-body{padding:0 12px 22px 34px; margin-left:20px; border-left:1px solid var(--line2)}

.props{margin-top:4px; font-size:13.5px; color:var(--ink2); max-width:60ch}
.props b{display:block; margin-bottom:3px; font-family:Unbounded,sans-serif; font-size:9.5px; font-weight:500; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}

.ctrls{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px; margin-top:18px}
.fld{display:flex; flex-direction:column; gap:7px; min-width:0}
.fld label{font-family:Unbounded,sans-serif; font-size:9.5px; font-weight:500; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}

.seg{display:flex; background:var(--sunk); border-radius:9px; padding:3px; gap:3px}
.seg button{
  flex:1 1 0; min-width:0; appearance:none; border:none; border-radius:7px; background:transparent;
  font-family:"Golos Text",sans-serif; font-size:12.5px; padding:7px 4px; cursor:pointer; color:var(--muted);
  transition:background .15s, color .15s;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(21,22,26,.10)}
.seg.g-ok button[data-val="shot"][aria-pressed="true"]{background:var(--ok); color:#fff}
.seg.g-ok button[data-val="retake"][aria-pressed="true"]{background:var(--bad); color:#fff}
.seg.g-ok button[data-val="moved"][aria-pressed="true"]{background:var(--warn); color:#fff}
.seg button:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}

input[type="text"]{
  font-family:"IBM Plex Mono", monospace; font-size:12.5px;
  background:var(--sunk); border:1px solid transparent; border-radius:9px;
  padding:9px 11px; color:var(--ink); width:100%; min-width:0; transition:background .15s, border-color .15s;
}
input.note{font-family:"Golos Text", sans-serif; font-size:13.5px}
input[type="text"]::placeholder{color:var(--muted)}
input[type="text"]:focus{outline:none; background:var(--surface); border-color:var(--ink)}

.jump{
  background:none; border:none; padding:0; margin-top:16px; cursor:pointer; color:var(--muted);
  font-family:"Golos Text",sans-serif; font-size:13px; border-bottom:1px solid var(--line);
}
.jump:hover{color:var(--ink); border-color:var(--ink)}
.jump:focus-visible{outline:2px solid var(--ink); outline-offset:3px}

/* ================= scripts ================= */
.scr{border-bottom:1px solid var(--line2); background:transparent}
.scr > summary{
  list-style:none; cursor:pointer; padding:15px 12px; display:flex; gap:13px; align-items:center;
  border-radius:10px; transition:background .15s;
}
.scr > summary::-webkit-details-marker{display:none}
.scr > summary:hover{background:var(--surface)}
.scr > summary:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}
.scr h3{margin:0; font-size:16px; font-weight:500; letter-spacing:-.012em; flex:1 1 200px; min-width:0}
.scr .badge{font-family:"IBM Plex Mono",monospace; font-size:10.5px; padding:3px 8px; border-radius:99px; background:var(--sunk); color:var(--muted); flex:none}
.scr .badge.on{background:var(--ok-bg); color:var(--ok)}
.scr .badge.re{background:var(--bad-bg); color:var(--bad)}
.scr-body{padding:4px 12px 38px}
.facts{
  display:flex; gap:7px 22px; flex-wrap:wrap; padding:0 0 22px;
  font-size:11.5px; color:var(--muted); font-family:"IBM Plex Mono", monospace;
}
.facts span b{color:var(--ink2); font-weight:500}
.text{max-width:58ch; border-left:2px solid var(--line); padding-left:22px}
.text p{margin:0 0 1.05em; font-size:17px; line-height:1.72; letter-spacing:-.006em}
.text p.stage{color:var(--muted); font-style:italic; font-size:14px; line-height:1.6}

/* ================= b-roll ================= */
.bro{
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  padding:13px 12px; border-bottom:1px solid var(--line2); border-radius:10px; transition:background .15s;
}
.bro:hover{background:var(--surface)}
.bro .txt{flex:1 1 250px; min-width:0}
.bro .txt b{display:block; font-size:14.5px; font-weight:500; letter-spacing:-.008em}
.bro .txt small{color:var(--muted); font-size:12px; font-family:"IBM Plex Mono",monospace}
.bro .seg{flex:none}
.bro .fl{flex:1 1 140px; min-width:120px; max-width:220px}

/* ================= checklists ================= */
.lists{display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:18px; margin-top:22px}
.list{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:var(--sh)}
.list-head{display:flex; gap:14px; align-items:center; margin-bottom:20px}
.list-head .t{flex:1; min-width:0}
.list h3{font-size:17px; margin:0; font-weight:600; letter-spacing:-.015em}
.list .who{color:var(--muted); font-size:12.5px; margin:2px 0 0; line-height:1.4}
.list .cnt{display:block; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted); margin-top:5px}
.ring{
  width:46px; height:46px; border-radius:50%; display:grid; place-items:center; flex:none;
  background:conic-gradient(var(--ok) calc(var(--p,0) * 1%), var(--sunk) 0); transition:background .4s;
}
.ring i{
  width:36px; height:36px; border-radius:50%; background:var(--surface); display:grid; place-items:center;
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-style:normal; color:var(--ink2); font-variant-numeric:tabular-nums;
}
.grp{
  font-family:Unbounded,sans-serif; font-size:9.5px; font-weight:500; letter-spacing:.13em;
  text-transform:uppercase; color:var(--muted); margin:22px 0 7px;
}
.grp:first-of-type{margin-top:0}
.chk{display:flex; gap:11px; align-items:flex-start; padding:7px 0; cursor:pointer; font-size:14.5px; line-height:1.45}
.chk input{
  appearance:none; width:18px; height:18px; flex:none; margin-top:1px;
  border:1.5px solid var(--line); border-radius:5px; background:var(--surface); cursor:pointer; position:relative;
  transition:background .15s, border-color .15s;
}
.chk:hover input{border-color:var(--muted)}
.chk input:checked{background:var(--ok); border-color:var(--ok)}
.chk input:checked::after{
  content:""; position:absolute; left:5.5px; top:1.5px; width:4px; height:9px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(43deg);
}
.chk input:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.chk input:checked + span{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line)}
.crow{display:flex; gap:6px; align-items:flex-start}
.crow .chk{flex:1; min-width:0}
.crow .chk span{overflow-wrap:anywhere}
.del{
  appearance:none; border:none; background:none; color:var(--line); cursor:pointer;
  font-size:18px; line-height:1; padding:5px 6px; border-radius:6px; margin-top:2px; flex:none; transition:color .15s, background .15s;
}
.crow:hover .del{color:var(--muted)}
.del:hover{color:var(--bad); background:var(--bad-bg)}
.del:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
.addrow{display:flex; gap:7px; margin-top:12px}
.addrow input{font-family:"Golos Text",sans-serif; font-size:13.5px}
.addrow button{
  appearance:none; border:none; background:var(--ink); color:var(--paper);
  font-family:"Golos Text",sans-serif; font-weight:500; font-size:13px;
  padding:0 16px; border-radius:9px; cursor:pointer; white-space:nowrap;
}
.addrow button:hover{opacity:.87}
.addrow button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
textarea.notes{
  width:100%; min-height:86px; resize:vertical; display:block;
  font-family:"Golos Text",sans-serif; font-size:13.5px; line-height:1.55;
  background:var(--sunk); border:1px solid transparent; border-radius:11px;
  padding:11px 12px; color:var(--ink); transition:background .15s, border-color .15s;
}
textarea.notes::placeholder{color:var(--muted)}
textarea.notes:focus{outline:none; background:var(--surface); border-color:var(--ink)}

.gate{
  position:fixed; inset:0; z-index:100; background:var(--paper);
  display:grid; place-items:center; padding:24px;
}
.gate-box{width:100%; max-width:360px}
.gate h2{font-family:Unbounded,sans-serif; font-size:19px; font-weight:600; margin:0 0 6px; letter-spacing:-.02em}
.gate p{color:var(--muted); font-size:13.5px; margin:0 0 20px; line-height:1.5}
.gate label{display:block; font-family:Unbounded,sans-serif; font-size:9.5px; font-weight:500; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); margin:0 0 7px}
.gate input{
  width:100%; font-family:"Golos Text",sans-serif; font-size:15px; padding:12px 13px;
  background:var(--sunk); border:1px solid transparent; border-radius:11px; color:var(--ink); margin-bottom:16px;
}
.gate input:focus{outline:none; background:var(--surface); border-color:var(--ink)}
.gate button{
  width:100%; appearance:none; border:none; background:var(--ink); color:var(--paper);
  font-family:"Golos Text",sans-serif; font-weight:500; font-size:15px; padding:13px; border-radius:11px; cursor:pointer;
}
.gate button:hover{opacity:.87}
.gate .err{color:var(--bad); font-size:13px; margin:-8px 0 14px; min-height:18px}

.feed{margin-top:20px}
.fe{display:flex; gap:13px; align-items:baseline; padding:11px 0; border-bottom:1px solid var(--line2); font-size:14px}
.fe time{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted); flex:none; min-width:78px}
.fe .who{font-weight:600; flex:none}
.fe .what{color:var(--ink2); flex:1; min-width:0}
.whoami{font-size:12.5px; color:var(--muted); margin-left:auto}
.whoami button{appearance:none; border:none; background:none; color:var(--muted); cursor:pointer; font-size:12.5px; text-decoration:underline; padding:0 0 0 6px; font-family:inherit}
.whoami button:hover{color:var(--ink)}

.panel{padding-top:2px}
@media (max-width:600px){
  .wrap, .top-in{padding-inline:16px}
  .item > summary{gap:10px; padding:13px 8px}
  .item > summary .chip{display:none}
  .item-body{padding-left:20px; margin-left:8px}
  .ctrls{grid-template-columns:1fr}
  .tabs{gap:18px}
  .bro{gap:10px}
  .bro .fl{max-width:none}
  .text{padding-left:16px}
  .text p{font-size:16px}
  .list{padding:18px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
}
</style>

<div class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Съёмочная смена</h1>
      <span class="sub">Астана Ремонт · Жасулан · 20 рилсов за 2 дня</span>
    </div>
    <div class="meter">
      <div class="segbar" id="segbar"></div>
      <b id="barnum">0 / 20</b>
      <span class="m2" id="barx">ничего не снято</span>
      <span class="saved" id="savedmark">сохранено</span>
      <span class="whoami" id="whoami"></span>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</div>

<div class="wrap">
  <div class="gate" id="gate" hidden>
  <div class="gate-box">
    <h2>Съёмочная смена</h2>
    <p>Астана Ремонт. Отметьте себя, чтобы в журнале было видно, кто что снял.</p>
    <label for="g-name">Как вас зовут</label>
    <input type="text" id="g-name" placeholder="Ержан" autocomplete="name">
    <div id="g-code-wrap" hidden>
      <label for="g-code">Код доступа</label>
      <input type="text" id="g-code" placeholder="код от Жасулана" autocomplete="off">
    </div>
    <div class="err" id="g-err"></div>
    <button type="button" id="g-go">Войти</button>
  </div>
</div>
<div id="notice" hidden></div>
  <div id="panels"></div>
</div>
<script>
const REELS = [
{n:1, day:1, time:"09:00", loc:"A", fn:"otlichie", hunt:"4 — выбирает подрядчика",
 title:"Алматинское дело, 70 млн",
 dev:"Зачин обращением к зрителю · финал просьбой переслать",
 props:"Ничего. Голые стены. Не называть фамилию и фирму — приговор не вступил в силу.",
 text:[
 "Это видео должен увидеть каждый гражданин Казахстана. И особенно если вы собрались делать ремонт или кто-то из ваших родственников. Поэтому им тоже отправьте.",
 "В общем, есть один такой товарищ в Алматы. Который собрал двадцать четыре семьи и целых семьдесят миллионов тенге, обещая сделать ремонт под ключ.",
 "Он брал предоплату, с кого-то всю сумму сразу. Люди кредиты под это брали, рассрочки оформляли.",
 "А потом работы просто встали.",
 "Он им говорил — кассовый разрыв у меня, бригада подвела, потерпите немного. И так месяцами. Люди звонят, он обещает. Люди приезжают, а на объекте никого.",
 "Потом он пропал совсем.",
 "И вот представьте. У человека кредит на три миллиона, который он платит каждый месяц. И квартира с голыми стенами, в которую он даже зайти не может.",
 "Суд его виновным признал. Светит до семи лет.",
 "Только деньги-то людям никто не вернул. И не вернёт.",
 "Теперь давайте я вам объясню самое главное. Почему вообще эта схема работает.",
 "Пока вы не заплатили — вы заказчик. Вам звонят, вам отвечают, под вас подстраиваются, вас уговаривают.",
 "Заплатили вперёд — и вы уже никто. Теперь вы звоните. Вы уговариваете. Вы ищете, где эти люди.",
 "Деньги поменяли местами вас и его. Вот и весь секрет.",
 "Меня самого так кинули в двадцатом году. Я тогда квартиру в новостройке купил, денег впритык, друзья мастеров посоветовали. Я им отдал вперёд, как все делают. Они неделю поработали и пропали. Я потом год эту квартиру сам доделывал.",
 "Поэтому когда я своё дело открывал, я сказал — предоплату брать не буду. И не беру до сих пор.",
 "У нас платят по этапам. Сделали кусок работы, вы приехали, посмотрели, приняли — заплатили за него. Не понравилось — не платите, я за свои поработал.",
 "Так что запомните одну вещь. Если у вас просят предоплату, а тем более всю сумму сразу — разворачивайтесь и уходите. Каким бы хорошим человек ни казался.",
 "И отправьте это видео тем, кто собрался делать ремонт. Двадцать четыре семьи уже попались. Пусть ваши родные не станут двадцать пятой."]},

{n:4, day:1, time:"09:30", loc:"A", fn:"doverie", hunt:"3 — сравнивает",

 text:[

 "Эту фразу подрядчик слышит примерно на третьем месяце. И чаще всего она справедливая.",
 "Разберу, откуда берётся разница, чтобы вы потом не поймали её на себе.",

 "Первый путь такой. Вам сразу дают низкую цену, про скрытые работы молчат, а потом ставят перед фактом. Платите, иначе стройка стоит.",
 "Второй путь. Вам называют твёрдую часть сметы и отдельно список того, что может вскрыться, с примерными суммами. Вы закладываете этот запас заранее.",
 "Я работаю по второму. Доброта тут ни при чём. Первый вариант всегда кончается ссорой, а нам на этом объекте ещё полгода работать.",

{n:13, day:1, time:"10:20", loc:"A", fn:"doverie", hunt:"2 — чует проблему",

{n:10, day:1, time:"11:00", loc:"A", fn:"doverie", hunt:"1 — не знает о проблеме",

 "Что происходит дальше. Тонкий провод под большой нагрузкой греется. Греется он внутри стены, где вы этого не видите. Сначала плавится оболочка, потом начинает плавиться место соединения. Пахнет палёным обычно уже поздно.",

{n:18, day:1, time:"14:45", loc:"B", fn:"otlichie", hunt:"4 — выбирает подрядчика",

/* ================= хранилище: Supabase ================= */
const CFG = window.BOARD_CONFIG || {};
const SB = (CFG.url && CFG.key) ? {base: String(CFG.url).replace(/\/+$/,"").replace(/\/rest\/v1$/,"") + "/rest/v1/", key: CFG.key} : null;
let online = !!SB;

function lsKey(p){ return "smena:"+p; }
function lsGet(p){ try{ const v=localStorage.getItem(lsKey(p)); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(p,b){ try{ localStorage.setItem(lsKey(p), JSON.stringify(b)); }catch(e){} }

function myName(){ try{ return localStorage.getItem("smena:name") || "кто-то"; }catch(e){ return "кто-то"; } }

async function sb(path, opts){
  opts = opts || {};
  const r = await fetch(SB.base + path, {
    method: opts.method || "GET",
    headers: Object.assign({
      apikey: SB.key,
      Authorization: "Bearer " + SB.key,
      "Content-Type": "application/json"
    }, opts.headers || {}),
    body: opts.body
  });
  if(!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0,180));
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function sbSave(id, data){
  await sb("board?on_conflict=id", {
    method: "POST",
    headers: {Prefer: "resolution=merge-duplicates,return=minimal"},
    body: JSON.stringify([{id: id, data: data, who: myName(), updated_at: new Date().toISOString()}])
  });
}
async function sbDrop(id){
  await sb("board?id=eq." + encodeURIComponent(id), {method:"DELETE", headers:{Prefer:"return=minimal"}});
}
async function sbAll(){ return sb("board?select=id,data"); }
async function sbLog(what){
  if(!SB) return;
  try { await sb("activity", {method:"POST", headers:{Prefer:"return=minimal"}, body: JSON.stringify([{who: myName(), what: what}])}); } catch(e){}
}
async function sbFeed(){ return sb("activity?select=at,who,what&order=at.desc&limit=60"); }

/* ---------- отложенная запись ---------- */
const pending = {};
function persist(path, body){
  if(pending[path]) clearTimeout(pending[path].t);
  pending[path] = {body: body, t: setTimeout(() => flushOne(path), 400)};
}
async function flushOne(path){
  const e = pending[path];
  if(!e) return;
  clearTimeout(e.t); delete pending[path];
  lsSet(path, e.body);
  if(!SB){ blink(); return; }
  try { await sbSave(path, e.body); markOnline(true); blink(); }
  catch(err){ markOnline(false); }
}
function flushAll(){ Object.keys(pending).forEach(flushOne); }
window.addEventListener("pagehide", flushAll);
window.addEventListener("blur", flushAll);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flushAll(); });

let blinkT = null;
function blink(){
  const s = document.getElementById("savedmark");
  if(!s) return;
  s.classList.add("on"); clearTimeout(blinkT);
  blinkT = setTimeout(() => s.classList.remove("on"), 1300);
}
function markOnline(ok){
  if(ok === online) return;
  online = ok;
  if(ok){ const n = document.getElementById("notice"); if(n) n.hidden = true; }
  else showNotice("Связь с сервером потеряна. Отметки сохраняются на этом устройстве и уйдут, как только связь вернётся.");
}
async function removeDoc(path){
  lsSaveCustom();
  try{ localStorage.removeItem(lsKey(path)); }catch(e){}
  if(!SB){ blink(); return; }
  try { await sbDrop(path); blink(); } catch(err){ markOnline(false); }
}
function lsSaveCustom(){ lsSet("customAll", state.custom); }
function newId(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function showNotice(msg){
  const n = document.getElementById("notice");
  n.className = "notice"; n.textContent = msg; n.hidden = false;
}

/* ---------- progress ---------- */
let segCells = null;
function buildSegbar(){
  const bar = document.getElementById("segbar");
  segCells = [];
  for(let i=1;i<=20;i++){
    const c = el("i"); if(i%5===0 && i<20) c.className = "gap";
    bar.appendChild(c); segCells.push(c);
  }
}
const dayOf = {}; REELS.forEach(r => dayOf[r.n] = r.day);
function dayStats(d){
  const list = REELS.filter(r => r.day === d);
  return {total:list.length, done:list.filter(r => state.reels[r.n].status === "shot").length};
}
function refreshMeter(){
  const done = REELS.filter(r => state.reels[r.n].status === "shot").length;
  const retake = REELS.filter(r => state.reels[r.n].status === "retake").length;
  const moved = REELS.filter(r => state.reels[r.n].status === "moved").length;
  if(segCells){
    const sorted = [...REELS].sort((a,b) => a.n - b.n);
    sorted.forEach((r,i) => {
      const c = segCells[i], base = (i+1)%5===0 && i<19 ? "gap " : "";
      const st = state.reels[r.n].status;
      c.className = base + (st === "shot" ? "on" : st === "retake" ? "re" : st === "moved" ? "mv" : "");
    });
  }
  document.getElementById("barnum").textContent = done + " / 20";
  const x = document.getElementById("barx");
  if(done === 20) x.textContent = "все двадцать сняты";
  else if(retake) x.textContent = "осталось " + (20-done) + ", переснять " + retake;
  else if(moved) x.textContent = "осталось " + (20-done) + ", перенесено " + moved;
  else if(done === 0) x.textContent = "смена не начата";
  else x.textContent = "осталось " + (20-done);
  [1,2].forEach(d => {
    const st = dayStats(d);
    const btn = document.getElementById("tab-d"+d);
    if(btn) btn.textContent = "День " + d + " · " + st.done + "/" + st.total;
    const h = document.getElementById("daystat-"+d);
    if(h) h.textContent = st.done === st.total
      ? "смена закрыта, все " + st.total + " сняты"
      : "снято " + st.done + " из " + st.total + ", осталось " + (st.total - st.done);
  });
}

/* ---------- segmented control ---------- */
function seg(opts, get, set, cls){
  const box = el("div","seg"+(cls?" "+cls:""));
  opts.forEach(o => {
    const b = el("button", null, o.label);
    b.type = "button"; b.dataset.val = o.val;
    b.addEventListener("click", () => { set(get() === o.val ? "" : o.val); });
    box.appendChild(b);
  });
  box.sync = () => { const v = get(); [...box.children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === v))); };
  box.sync();
  return box;
}
function field(label, node){
  const f = el("div","fld"); f.appendChild(el("label",null,label)); f.appendChild(node); return f;
}
function textInput(ph, get, set, cls){
  const i = document.createElement("input");
  i.type = "text"; i.placeholder = ph; i.value = get() || ""; if(cls) i.className = cls;
  i.addEventListener("input", () => set(i.value));
  i.sync = () => { if(document.activeElement !== i) i.value = get() || ""; };
  return i;
}

/* ---------- shot row ---------- */
const reelSync = {};
const NEEDS = {}; REELS.forEach(r => NEEDS[r.n] = r.text.some(t => /\[[А-ЯЁ]/.test(t)));

function reelRow(n){
  const r = byN[n], s = state.reels[n];
  const d = document.createElement("details");
  d.className = "item"; d.id = "item-"+n; d.dataset.st = s.status || "todo"; d.dataset.n = String(n);

  if(NEEDS[n]) sm.appendChild(el("span","flag","нужны цифры"));
  sm.appendChild(el("span","chip f-"+r.fn, FN[r.fn]));
  sm.appendChild(el("span","chev","\u25b8"));
  d.appendChild(sm);

  const body = el("div","item-body");
  const pr = el("div","props");
  pr.appendChild(el("b", null, "Реквизит и предупреждения"));
  pr.appendChild(document.createTextNode(r.props));
  body.appendChild(pr);

  const ctr = el("div","ctrls");
  const save = () => { persist("reels/"+pad(n), {...s}); syncReel(n); refreshMeter(); applyFilter(r.day); };

  const ST = {shot:"снят", retake:"на пересъёмку", moved:"перенесён", "":"отметка снята"};
  const stSeg = seg(
    [{val:"shot",label:"Снято"},{val:"retake",label:"Переснять"},{val:"moved",label:"Перенос"}],
    () => s.status, v => { s.status = v; save(); sbLog("\u2116" + n + " «" + r.title + "» — " + ST[v]); }, "g-ok");
  ctr.appendChild(field("Статус", stSeg));

  const RT = {good:"хорошо", ok:"норм", bad:"слабо", "":"оценка убрана"};
  const rtSeg = seg(
    [{val:"good",label:"Хорошо"},{val:"ok",label:"Норм"},{val:"bad",label:"Слабо"}],
    () => s.rating, v => { s.rating = v; save(); sbLog("\u2116" + n + " «" + r.title + "» — оценка: " + RT[v]); });
  ctr.appendChild(field("Как вышло", rtSeg));

  const fi = textInput("C0043, C0044", () => s.files, v => { s.files = v; save(); });
  fi.addEventListener("blur", flushAll);
  ctr.appendChild(field("Файлы для монтажёра", fi));

  const ni = textInput("что пошло не так", () => s.note, v => { s.note = v; save(); }, "note");
  ni.addEventListener("blur", flushAll);
  ctr.appendChild(field("Заметка", ni));
  body.appendChild(ctr);

  const j = el("button","jump","Открыть сценарий \u2116" + n);
  j.type = "button";
  j.addEventListener("click", () => {
    showTab("scripts");
    const t = document.getElementById("scr-"+n);
    t.open = true; t.scrollIntoView({behavior:"smooth", block:"start"});
  });
  body.appendChild(j);
  d.appendChild(body);

  sm.addEventListener("click", () => {
    if(d.open) return;
    const pane = d.closest(".panel");
    if(pane) pane.querySelectorAll(".item[open]").forEach(o => { if(o !== d) o.open = false; });
  });

  reelSync[n] = () => {
    d.dataset.st = s.status || "todo";
    stSeg.sync(); rtSeg.sync(); fi.sync(); ni.sync();
    const b = document.getElementById("badge-"+n);
    if(b){
      b.className = "badge" + (s.status === "shot" ? " on" : s.status === "retake" ? " re" : "");
      b.textContent = s.status === "shot" ? "снято" : s.status === "retake" ? "переснять" : s.status === "moved" ? "перенос" : "не снято";
    }
  };
  return d;
}
function syncReel(n){ if(reelSync[n]) reelSync[n](); }

/* ---------- day panel ---------- */
const filterOf = {1:"all", 2:"all"};
function applyFilter(d){
  const pane = panels["d"+d];
  if(!pane) return;
  const f = filterOf[d];
  pane.querySelectorAll(".item").forEach(it => {
    const st = state.reels[+it.dataset.n].status || "todo";
    it.hidden = !(f === "all" || (f === "todo" && st === "todo") || f === st);
  });
  pane.querySelectorAll(".filters button[data-f]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === f)));
}
function copyFiles(d, btn){
  const lines = REELS.filter(r => r.day === d).sort((a,b) => a.n - b.n).map(r => {
    const s = state.reels[r.n];
    return "REEL_" + String(r.n).padStart(2,"0") + "  " + r.title + "  —  " + (s.files || "файлы не вписаны") + (s.note ? "  (" + s.note + ")" : "");
  });
  const txt = "Съёмка, день " + d + "\n" + lines.join("\n");
  const flash = word => {
    if(!btn) return;
    const was = btn.dataset.label || btn.textContent;
    btn.dataset.label = was;
    btn.textContent = word;
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { btn.textContent = btn.dataset.label; }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => flash("Скопировано"), () => flash("Не вышло"));
  } else flash("Не вышло");
}
function dayPanel(d){
  const p = el("div","panel");

  const f = el("div","filters");
  [["all","Все"],["todo","Не снято"],["shot","Снято"],["retake","Переснять"],["moved","Перенос"]].forEach(([k,label]) => {
    const b = el("button", null, label); b.type = "button"; b.dataset.f = k;
    b.addEventListener("click", () => { filterOf[d] = k; applyFilter(d); });
    f.appendChild(b);
  });
  f.appendChild(el("span","spacer"));
  const cp = el("button","act","Скопировать файлы"); cp.type = "button";
  cp.addEventListener("click", () => copyFiles(d, cp));
  f.appendChild(cp);
  p.appendChild(f);

  const st = el("p","lead");
  const strong = el("b","",""); strong.id = "daystat-"+d;
  st.appendChild(strong);
  st.appendChild(document.createTextNode(". Порядок сверху вниз, время приблизительное. Тапните строку, чтобы отметить и вписать файлы."));
  p.appendChild(st);

  DAYS[d].rows.forEach(row => {
    if(row.k === "block"){
      const h = el("div","block-head");
      h.appendChild(el("span","loc", LOCS[row.loc].name));
      h.appendChild(el("span","meta", row.time + " · " + LOCS[row.loc].hint));
      p.appendChild(h);
      p.appendChild(el("p","lead", row.note));
    } else if(row.k === "break"){
      const b = el("div","break");
      b.appendChild(el("time", null, row.time));
      b.appendChild(el("span", null, row.text));
      p.appendChild(b);
    } else {
      p.appendChild(reelRow(row.n));
    }
  });
  return p;
}

/* ---------- b-roll panel ---------- */
const brollSync = {};
function brollPanel(){
  const p = el("div","panel");
  p.appendChild(el("p","lead","Кадры без речи. Монтажёр закрывает ими склейки, без них двадцать говорящих голов подряд не смотрятся. Снимать сразу после блока, пока свет и локация те же."));
  [1,2].forEach(d => {
    let lastPlace = null;
    BROLL.filter(b => b.day === d).forEach(b => {
      if(b.place !== lastPlace){
        const h = el("div","block-head");
        h.appendChild(el("span","loc", "День " + d + " · " + b.place));
        p.appendChild(h);
        lastPlace = b.place;
      }
      const s = state.broll[b.id];
      const row = el("div","bro");
      const txt = el("div","txt");
      txt.appendChild(el("b", null, b.t));
      txt.appendChild(el("small", null, "для: " + b.u));
      row.appendChild(txt);
      const save = () => { persist("broll/"+b.id, {...s}); if(brollSync[b.id]) brollSync[b.id](); };
      const sg = seg([{val:"shot",label:"Снято"}], () => s.status, v => { s.status = v; save(); sbLog("доп. кадр " + (v ? "снят" : "отменён") + ": " + b.t); }, "g-ok");
      row.appendChild(sg);
      const fi = textInput("файл", () => s.files, v => { s.files = v; save(); });
      const w = el("div","fl"); w.appendChild(fi); row.appendChild(w);
      p.appendChild(row);
      brollSync[b.id] = () => { sg.sync(); fi.sync(); };
    });
  });
  return p;
}

/* ---------- checklists ---------- */
const checkSync = {};
function checksPanel(){
  const p = el("div","panel");
  p.appendChild(el("p","lead","Три списка. Галочки ставит каждый со своего телефона, все видят одно и то же. Внизу каждого списка можно дописывать свои пункты и оставлять заметки — они сохраняются так же, как всё остальное."));
  const grid = el("div","lists");
  CHECKS.forEach(list => {
    const box = el("div","list");
    const head = el("div","list-head");
    const ring = el("div","ring"); ring.id = "ring-"+list.id;
    const ri = el("i", null, "0%"); ri.id = "ringnum-"+list.id;
    ring.appendChild(ri); head.appendChild(ring);
    const ht = el("div","t");
    ht.appendChild(el("h3", null, list.who));
    ht.appendChild(el("p","who", list.sub));
    const cnt = el("span","cnt",""); cnt.id = "cnt-"+list.id;
    ht.appendChild(cnt);
    head.appendChild(ht);
    box.appendChild(head);

    list.groups.forEach((g, gi) => {
      box.appendChild(el("div","grp", g.g));
      g.items.forEach((item, ii) => {
        const id = list.id + "-" + gi + "-" + ii;
        state.checks[id] = state.checks[id] || {done:false};
        const lab = el("label","chk");
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.id = "chk-"+id; cb.checked = !!state.checks[id].done;
        cb.addEventListener("change", () => {
          state.checks[id].done = cb.checked;
          persist("checks/"+id, {done: cb.checked});
          countList(list);
          sbLog((cb.checked ? "готово: " : "снял галочку: ") + item);
        });
        lab.appendChild(cb); lab.appendChild(el("span", null, item));
        box.appendChild(lab);
        checkSync[id] = () => { const c = document.getElementById("chk-"+id); if(c) c.checked = !!state.checks[id].done; countList(list); };
      });
    });

    box.appendChild(el("div","grp","Свои пункты"));
    const holder = el("div"); holder.id = "own-"+list.id;
    box.appendChild(holder);

    const addrow = el("div","addrow");
    const inp = document.createElement("input");
    inp.type = "text"; inp.id = "add-"+list.id; inp.placeholder = "дописать пункт и нажать Enter";
    const btn = el("button", null, "Добавить"); btn.type = "button";
    const addItem = () => {
      const t = inp.value.trim();
      if(!t) return;
      const id = newId();
      state.custom[id] = {list:list.id, text:t, done:false, ts:Date.now()};
      persist("custom/"+id, state.custom[id]);
      lsSaveCustom();
      sbLog("добавил пункт (" + list.who + "): " + t);
      inp.value = "";
      renderCustom(list.id); countList(list);
      inp.focus();
    };
    btn.addEventListener("click", addItem);
    inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); addItem(); } });
    addrow.appendChild(inp); addrow.appendChild(btn);
    box.appendChild(addrow);

    box.appendChild(el("div","grp","Заметки"));
    const ta = document.createElement("textarea");
    ta.className = "notes"; ta.id = "notes-"+list.id;
    ta.placeholder = "что выяснилось на площадке, что переделать, что спросить";
    ta.value = (state.notes[list.id] && state.notes[list.id].text) || "";
    ta.addEventListener("input", () => {
      state.notes[list.id] = {text: ta.value};
      persist("notes/"+list.id, {text: ta.value});
    });
    ta.addEventListener("blur", flushAll);
    box.appendChild(ta);

    grid.appendChild(box);
  });
  p.appendChild(grid);
  return p;
}

function renderCustom(listId){
  const holder = document.getElementById("own-"+listId);
  if(!holder) return;
  holder.textContent = "";
  const rows = Object.keys(state.custom)
    .filter(id => state.custom[id] && state.custom[id].list === listId)
    .sort((a,b) => (state.custom[a].ts||0) - (state.custom[b].ts||0));
  if(!rows.length){
    const e = el("p","who","Пока пусто. Свои пункты добавляются ниже.");
    e.style.margin = "2px 0 0"; holder.appendChild(e);
    return;
  }
  rows.forEach(id => {
    const it = state.custom[id];
    const row = el("div","crow");
    const lab = el("label","chk");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!it.done;
    cb.addEventListener("change", () => {
      it.done = cb.checked;
      persist("custom/"+id, {list:it.list, text:it.text, done:it.done, ts:it.ts});
      lsSaveCustom();
      sbLog((it.done ? "готово: " : "снял галочку: ") + it.text);
      CHECKS.forEach(countList);
    });
    lab.appendChild(cb); lab.appendChild(el("span", null, it.text));
    row.appendChild(lab);
    const del = el("button","del","\u00d7");
    del.type = "button"; del.title = "Удалить пункт";
    del.setAttribute("aria-label", "Удалить пункт");
    del.addEventListener("click", () => {
      if(!confirm("Удалить пункт «" + it.text + "»?")) return;
      delete state.custom[id];
      removeDoc("custom/"+id);
      sbLog("удалил пункт: " + it.text);
      renderCustom(listId); CHECKS.forEach(countList);
    });
    row.appendChild(del);
    holder.appendChild(row);
  });
}

function countList(list){
  let total = 0, done = 0;
  list.groups.forEach((g, gi) => g.items.forEach((it, ii) => {
    total++; const id = list.id+"-"+gi+"-"+ii;
    if(state.checks[id] && state.checks[id].done) done++;
  }));
  Object.keys(state.custom).forEach(id => {
    if(state.custom[id] && state.custom[id].list === list.id){ total++; if(state.custom[id].done) done++; }
  });
  const c = document.getElementById("cnt-"+list.id);
  if(c) c.textContent = done + " из " + total;
  const pc = total ? Math.round(done/total*100) : 0;
  const ring = document.getElementById("ring-"+list.id);
  if(ring) ring.style.setProperty("--p", pc);
  const rn = document.getElementById("ringnum-"+list.id);
  if(rn) rn.textContent = pc + "%";
}

/* ---------- tabs ---------- */
const TABS = [
  {id:"d1",      label:"День 1",       build:() => dayPanel(1)},
  {id:"d2",      label:"День 2",       build:() => dayPanel(2)},
  {id:"scripts", label:"Сценарии",     build:scriptsPanel},
  {id:"broll",   label:"Доп. съёмки",  build:brollPanel},
  {id:"checks",  label:"Чек-листы",    build:checksPanel},
  {id:"feed",    label:"Журнал",       build:feedPanel}
];
const panels = {};
function showTab(id){
  if(id === "feed" && typeof pullFeed === "function") pullFeed();
  TABS.forEach(t => {
    const btn = document.getElementById("tab-"+t.id);
    btn.setAttribute("aria-selected", String(t.id === id));
    panels[t.id].hidden = t.id !== id;
  });
  try { localStorage.setItem("smena:tab", id); } catch(e){}
}
function buildUI(){
  const tabbar = document.getElementById("tabs"), host = document.getElementById("panels");
  TABS.forEach(t => {
    const b = el("button", null, t.label);
    b.id = "tab-"+t.id; b.type = "button"; b.setAttribute("role","tab");
    b.addEventListener("click", () => showTab(t.id));
    tabbar.appendChild(b);
    const pane = t.build();
    pane.id = "panel-"+t.id; pane.setAttribute("role","tabpanel");
    panels[t.id] = pane; host.appendChild(pane);
  });
  buildSegbar();
  CHECKS.forEach(l => { renderCustom(l.id); countList(l); });
  applyFilter(1); applyFilter(2);
  let start = "d1";
  try { const s = localStorage.getItem("smena:tab"); if(s && panels[s]) start = s; } catch(e){}
  showTab(start);
  refreshMeter();
}
buildUI();

/* ================= журнал ================= */
function feedPanel(){
  const p = el("div","panel");
  p.appendChild(el("p","lead","Кто что отметил. Обновляется сам, последние шестьдесят действий."));
  const f = el("div","feed"); f.id = "feedlist";
  f.appendChild(el("p","lead","Пока ничего не отмечено."));
  p.appendChild(f);
  return p;
}
function fmtTime(iso){
  const d = new Date(iso);
  if(isNaN(d)) return "";
  const hh = String(d.getHours()).padStart(2,"0"), mm = String(d.getMinutes()).padStart(2,"0");
  const today = new Date();
  const same = d.getDate()===today.getDate() && d.getMonth()===today.getMonth() && d.getFullYear()===today.getFullYear();
  return same ? hh+":"+mm : String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+" "+hh+":"+mm;
}
function renderFeed(rows){
  const f = document.getElementById("feedlist");
  if(!f) return;
  f.textContent = "";
  if(!rows || !rows.length){ f.appendChild(el("p","lead","Пока ничего не отмечено.")); return; }
  rows.forEach(r => {
    const line = el("div","fe");
    line.appendChild(el("time", null, fmtTime(r.at)));
    line.appendChild(el("span","who", r.who || "кто-то"));
    line.appendChild(el("span","what", r.what || ""));
    f.appendChild(line);
  });
}

/* ================= синхронизация ================= */
function applyDoc(id, data){
  if(!data) return;
  if(id.indexOf("reels/") === 0){
    const n = parseInt(id.slice(7), 10);
    if(state.reels[n]){
      Object.assign(state.reels[n], {status:data.status||"", rating:data.rating||"", files:data.files||"", note:data.note||""});
      syncReel(n);
    }
  } else if(id.indexOf("broll/") === 0){
    const k = id.slice(6);
    if(state.broll[k]){ Object.assign(state.broll[k], {status:data.status||"", files:data.files||""}); if(brollSync[k]) brollSync[k](); }
  } else if(id.indexOf("checks/") === 0){
    const k = id.slice(7);
    if(state.checks[k]){ state.checks[k].done = !!data.done; if(checkSync[k]) checkSync[k](); }
  } else if(id.indexOf("notes/") === 0){
    const k = id.slice(6);
    state.notes[k] = {text: data.text || ""};
    const ta = document.getElementById("notes-"+k);
    if(ta && document.activeElement !== ta) ta.value = data.text || "";
  }
}
async function pull(){
  if(!SB) return;
  try{
    const rows = await sbAll();
    markOnline(true);
    const nextCustom = {};
    rows.forEach(r => {
      if(!r.id) return;
      if(r.id.indexOf("custom/") === 0){
        if(r.data && r.data.list) nextCustom[r.id.slice(7)] = {list:r.data.list, text:r.data.text||"", done:!!r.data.done, ts:r.data.ts||0};
      } else if(!pending[r.id]) applyDoc(r.id, r.data);
    });
    state.custom = nextCustom;
    CHECKS.forEach(l => { renderCustom(l.id); countList(l); });
    refreshMeter(); applyFilter(1); applyFilter(2);
  }catch(e){
    const m = String(e && e.message || "");
    if(/PGRST205|42P01|does not exist|Could not find the table|^404/.test(m)){
      online = false;
      showNotice("Хранилище подключено, но таблицы не созданы. В Supabase откройте SQL Editor, вставьте файл docs/supabase.sql и нажмите Run.");
    } else markOnline(false);
  }
}
function loadLocal(){
  REELS.forEach(r => { const v = lsGet("reels/"+pad(r.n)); if(v){ Object.assign(state.reels[r.n], v); syncReel(r.n); } });
  BROLL.forEach(b => { const v = lsGet("broll/"+b.id); if(v){ Object.assign(state.broll[b.id], v); if(brollSync[b.id]) brollSync[b.id](); } });
  Object.keys(state.checks).forEach(id => { const v = lsGet("checks/"+id); if(v){ state.checks[id] = v; if(checkSync[id]) checkSync[id](); } });
  const cu = lsGet("customAll"); if(cu) state.custom = cu;
  CHECKS.forEach(l => {
    const nv = lsGet("notes/"+l.id);
    if(nv){ state.notes[l.id] = nv; const ta = document.getElementById("notes-"+l.id); if(ta) ta.value = nv.text || ""; }
    renderCustom(l.id); countList(l);
  });
  refreshMeter(); applyFilter(1); applyFilter(2);
}

/* ================= вход ================= */
function showWhoami(){
  const w = document.getElementById("whoami");
  if(!w) return;
  w.textContent = "";
  w.appendChild(document.createTextNode(myName()));
  const b = el("button", null, "сменить"); b.type = "button";
  b.addEventListener("click", () => { try{ localStorage.removeItem("smena:name"); }catch(e){} openGate(); });
  w.appendChild(b);
}
function openGate(){
  const g = document.getElementById("gate");
  const nameI = document.getElementById("g-name");
  const codeI = document.getElementById("g-code");
  const codeW = document.getElementById("g-code-wrap");
  const err = document.getElementById("g-err");
  let savedCode = ""; try{ savedCode = localStorage.getItem("smena:code") || ""; }catch(e){}
  const needCode = !!CFG.code && savedCode !== CFG.code;
  codeW.hidden = !needCode;
  try{ nameI.value = localStorage.getItem("smena:name") || ""; }catch(e){}
  g.hidden = false;
  setTimeout(() => nameI.focus(), 60);
  const go = () => {
    const nm = nameI.value.trim();
    if(nm.length < 2){ err.textContent = "Впишите имя, чтобы было видно, кто отмечал."; nameI.focus(); return; }
    if(needCode && codeI.value.trim() !== CFG.code){ err.textContent = "Код не подходит. Спросите у Жасулана."; codeI.focus(); return; }
    try{ localStorage.setItem("smena:name", nm); if(CFG.code) localStorage.setItem("smena:code", CFG.code); }catch(e){}
    err.textContent = "";
    g.hidden = true;
    showWhoami();
  };
  document.getElementById("g-go").onclick = go;
  [nameI, codeI].forEach(i => { i.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); go(); } }; });
}

/* ================= старт ================= */
(function start(){
  let hasName = false;
  try{ hasName = !!localStorage.getItem("smena:name"); }catch(e){}
  let codeOk = !CFG.code;
  try{ if(CFG.code && localStorage.getItem("smena:code") === CFG.code) codeOk = true; }catch(e){}
  if(hasName && codeOk) showWhoami(); else openGate();

  if(!SB){
    showNotice("Сайт ещё не подключён к общему хранилищу. Отметки сохраняются только на этом устройстве. Впишите адрес и ключ в файл config.js.");
    loadLocal();
    return;
  }
  loadLocal();
  pull(); pullFeed();
  setInterval(() => { if(document.visibilityState !== "hidden") pull(); }, 7000);
  setInterval(() => { if(document.visibilityState !== "hidden" && panels.feed && !panels.feed.hidden) pullFeed(); }, 7000);
  window.addEventListener("focus", () => { pull(); pullFeed(); });
})();
async function pullFeed(){
  if(!SB) return;
  try{ renderFeed(await sbFeed()); }catch(e){}
}
